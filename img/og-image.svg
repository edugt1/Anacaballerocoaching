<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3E5A6D"/>
      <stop offset="100%" style="stop-color:#4F6F86"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle texture circles -->
  <circle cx="980" cy="120" r="320" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1050" cy="500" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="550" r="250" fill="rgba(255,255,255,0.03)"/>

  <!-- Left accent bar -->
  <rect x="80" y="180" width="4" height="270" rx="2" fill="rgba(255,255,255,0.35)"/>

  <!-- Name -->
  <text x="116" y="265" font-family="Georgia, serif" font-size="68" font-weight="600" fill="white" letter-spacing="-1">Ana Caballero</text>

  <!-- Tagline -->
  <text x="118" y="320" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.75)" letter-spacing="6">EXECUTIVE COACH</text>

  <!-- Divider -->
  <rect x="118" y="355" width="560" height="1.5" rx="1" fill="rgba(255,255,255,0.2)"/>

  <!-- Description -->
  <text x="118" y="400" font-family="Georgia, serif" font-size="26" fill="rgba(255,255,255,0.9)" font-style="italic">Coaching ejecutivo para profesionales y líderes</text>
  <text x="118" y="435" font-family="Georgia, serif" font-size="26" fill="rgba(255,255,255,0.9)" font-style="italic">que quieren crecer con criterio e impacto real.</text>

  <!-- Pills -->
  <rect x="118" y="478" width="178" height="38" rx="19" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="207" y="502" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.85)" text-anchor="middle">Claridad para decidir</text>

  <rect x="308" y="478" width="190" height="38" rx="19" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="403" y="502" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.85)" text-anchor="middle">Seguridad para liderar</text>

  <rect x="510" y="478" width="220" height="38" rx="19" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="620" y="502" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.85)" text-anchor="middle">Foco para avanzar con impacto</text>

  <!-- Website URL -->
  <text x="118" y="580" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.45)" letter-spacing="1">www.anacaballerocoach.es</text>

  <!-- AC monogram right -->
  <circle cx="1060" cy="315" r="90" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="1060" y="340" font-family="Georgia, serif" font-size="52" font-weight="700" fill="rgba(255,255,255,0.25)" text-anchor="middle">AC</text>
</svg>
